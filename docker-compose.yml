services:
  database:
    image: mongo:6.0
    container_name: codesync-mongodb
    restart: unless-stopped
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27017" ]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mongo-init:
    image: mongo:6.0
    container_name: codesync-mongo-init
    depends_on:
      - database
    command: >
      bash -c '
        until mongosh --host database:27017 --eval "print(\"waited for connection\")"; do sleep 2; done;
        mongosh --host database:27017 --eval "try { rs.status(); } catch (e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"database:27017\" }] }); }"
      '
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: codesync-api
    restart: unless-stopped
    ports:
      # Bind to localhost only – no external interface exposure needed for local benchmarking.
      # Change to "5000:5000" only if another service on a different host requires direct access.
      - "127.0.0.1:5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=mongodb://database:27017/codesync
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    depends_on:
      - database

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: codesync-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongo-data:
